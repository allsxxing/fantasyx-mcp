name: League Tone Knowledge Update

# schedule and workflow_dispatch only. There is no push trigger, so a commit
# this job pushes cannot start another run. GITHUB_TOKEN pushes also do not
# create workflow runs.
on:
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC
  workflow_dispatch:
  # Temporary proof run. Removed after the job is observed. This ref is not main,
  # so the commit step pushes league-tone-update and leaves main alone.
  push:
    branches:
      - cursor/league-tone-commit-main-3625

# main is unprotected and has no ruleset, so contents: write is enough to
# commit there — the same opt-in sync-sleeper.yml uses. This repo will not
# allow Actions to open pull requests, so this job does not request
# pull-requests: write and does not call create-pull-request.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run updater
        run: |
          python3 skills/league-tone/scripts/update_knowledge.py || true

      - name: Commit knowledge updates
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No knowledge updates — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/league-tone/references/learning-log.md
          if git diff --cached --quiet; then
            echo "No staged knowledge updates — nothing to commit."
            exit 0
          fi
          git commit -m "chore(league-tone): knowledge update candidates ($(date -u +%Y-%m-%d))"
          # A scheduled or manual run checks out main and commits there.
          # workflow_dispatch of any other ref must not update main.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git push origin HEAD:main
          else
            echo "Ref is ${GITHUB_REF}. Pushing candidates to league-tone-update, not main."
            git push origin HEAD:league-tone-update
          fi
