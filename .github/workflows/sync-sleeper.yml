name: Sync Sleeper → Content → Calendar

# Pulls live league state from the public Sleeper API and commits the regenerated
# content/seasons/*.json + content/managers.json + content/key-dates.json. Sleeper needs no
# credentials, so contents:write is the only permission required for that half — scoped here
# rather than in repo settings.
#
# After the commit, optionally pushes the 4 Sleeper-derived key-dates.json events (Draft Day,
# Week 1 Kickoff, Trade Deadline, Playoffs Start) into the league's Google Calendar via a
# service account. That step is entirely optional: GCAL_SA_KEY is empty on forks/PRs and the
# step no-ops cleanly rather than failing. It never touches any other calendar event.
#
# Phase-aware schedule. GitHub cron has no per-date gating, so the phases are expressed as
# separate entries with the same job behind them; the no-op guard below means an out-of-phase
# run just exits clean. All times UTC — the league runs on CT.

on:
  workflow_dispatch:
  schedule:
    # Preseason / draft window: once daily. Catches the draft randomization and the last
    # open seat filling without doubling up cron entries at the same hour.
    - cron: '0 13 * * *'
    # In-season: Tuesday 13:00 UTC (~8am CT), after Monday night finalizes.
    - cron: '0 13 * * 2'
    # Offseason baseline: the 1st of each month.
    - cron: '0 13 1 * *'

concurrency:
  group: sync-sleeper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GCAL_SA_KEY: ${{ secrets.GCAL_SA_KEY }}
      GCAL_CALENDAR_ID: ${{ vars.GCAL_CALENDAR_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Cron entries fire year-round, so each one is gated to the phase it was written for.
      # github.event.schedule identifies which entry fired; workflow_dispatch bypasses the gate.
      - name: Phase gate
        id: gate
        run: |
          SCHED='${{ github.event.schedule }}'
          if [ -z "$SCHED" ]; then
            echo "Manual run — bypassing phase gate."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          MD=$(date -u +%m%d)
          case "$SCHED" in
            # Preseason / draft window: Aug 1 – Sep 10
            '0 13 * * *')    [ "$MD" \> "0731" ] && [ "$MD" \< "0911" ] && OK=1 ;;
            # In-season: Sep 11 – Jan 10 (wraps the year end)
            '0 13 * * 2')    { [ "$MD" \> "0910" ] || [ "$MD" \< "0111" ]; } && OK=1 ;;
            # Offseason: Jan 11 – Jul 31
            '0 13 1 * *')    [ "$MD" \> "0110" ] && [ "$MD" \< "0801" ] && OK=1 ;;
          esac
          if [ "${OK:-0}" = "1" ]; then
            echo "In phase for '$SCHED' (today $MD) — syncing."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Out of phase for '$SCHED' (today $MD) — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: steps.gate.outputs.run == 'true'

      - name: Sync from Sleeper
        if: steps.gate.outputs.run == 'true'
        run: npm run sync:sleeper

      # Gate: never push content that fails its JSON Schema. A red validate here means the
      # sync produced something the MCP server would serve incorrectly.
      - name: Validate content
        if: steps.gate.outputs.run == 'true'
        run: npm run validate

      - name: Commit changes
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes from Sleeper — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          git commit -m "sync: Sleeper league state $(date -u +%Y-%m-%d)"
          git push

      # Always shows what WOULD change on the calendar, even when the write step below is
      # skipped (no secret) — the pending delta stays visible in the Actions run summary.
      - name: Preview calendar changes
        if: steps.gate.outputs.run == 'true'
        run: npm run sync:calendar -- --dry-run >> "$GITHUB_STEP_SUMMARY"

      # Pushes the 4 Sleeper-derived events (Draft Day, Week 1 Kickoff, Trade Deadline,
      # Playoffs Start) to Google Calendar by their frozen deterministic ids only — it never
      # lists or deletes, so it cannot touch any human-authored event. Runs after both the
      # validate gate and the commit, so nothing reaches the calendar that hasn't landed in
      # git. Clean no-op (not a failure) when the secret is unset, e.g. on a fork or PR.
      - name: Sync Google Calendar
        if: steps.gate.outputs.run == 'true' && env.GCAL_SA_KEY != ''
        run: npm run sync:calendar
