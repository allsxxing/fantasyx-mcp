name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm test

      # prebuild (snapshot-upstream-tools.mjs) skips Flaim/FantasyPros when
      # FLAIM_* / FANTASYPROS_* are unset, and the public build needs no env.
      - run: npm run build

      - run: npm run validate
