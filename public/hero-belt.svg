<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#ffffff" />
      <path d="M0,0 L16,16 M16,0 L0,16" stroke="#111111" stroke-width="1.6" />
    </pattern>
    <pattern id="hatchSide" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#ffffff" />
      <path d="M0,0 L14,14 M14,0 L0,14" stroke="#111111" stroke-width="1.4" />
    </pattern>
  </defs>

  <!-- poster background -->
  <rect width="1600" height="900" fill="#f4f2ea" />

  <!-- scattered grunge speckle -->
  <g fill="#111111" opacity="0.55">
    <circle cx="90" cy="120" r="3" /><circle cx="140" cy="90" r="2" /><circle cx="60" cy="220" r="2.5" />
    <circle cx="1520" cy="140" r="3" /><circle cx="1470" cy="95" r="2" /><circle cx="1540" cy="230" r="2.5" />
    <circle cx="200" cy="740" r="2.5" /><circle cx="260" cy="800" r="2" /><circle cx="1400" cy="760" r="2.5" />
    <circle cx="1350" cy="810" r="2" /><circle cx="800" cy="60" r="2" /><circle cx="820" cy="40" r="1.6" />
  </g>

  <!-- left side plate -->
  <g stroke="#111111" stroke-width="10">
    <polygon points="110,300 330,300 380,360 380,560 330,620 110,620 60,560 60,360" fill="url(#hatchSide)" />
  </g>
  <g fill="#111111" stroke="#f4f2ea" stroke-width="3">
    <circle cx="150" cy="330" r="8" /><circle cx="290" cy="330" r="8" />
    <circle cx="150" cy="590" r="8" /><circle cx="290" cy="590" r="8" />
  </g>
  <g stroke="#111111" stroke-width="10">
    <polygon points="175,410 315,410 315,510 175,510" fill="#f4f2ea" />
  </g>
  <g stroke="#111111" stroke-width="8">
    <path d="M 195 430 L 295 490 M 295 430 L 195 490" fill="none" />
  </g>

  <!-- right side plate (mirrored) -->
  <g stroke="#111111" stroke-width="10">
    <polygon points="1490,300 1270,300 1220,360 1220,560 1270,620 1490,620 1540,560 1540,360" fill="url(#hatchSide)" />
  </g>
  <g fill="#111111" stroke="#f4f2ea" stroke-width="3">
    <circle cx="1450" cy="330" r="8" /><circle cx="1310" cy="330" r="8" />
    <circle cx="1450" cy="590" r="8" /><circle cx="1310" cy="590" r="8" />
  </g>
  <g stroke="#111111" stroke-width="10">
    <polygon points="1425,410 1285,410 1285,510 1425,510" fill="#f4f2ea" />
  </g>
  <g stroke="#111111" stroke-width="8">
    <path d="M 1305 430 L 1405 490 M 1405 430 L 1305 490" fill="none" />
  </g>

  <!-- connecting strap hint between plates -->
  <g stroke="#111111" stroke-width="6" opacity="0.5">
    <path d="M 380 460 L 480 460" />
    <path d="M 1120 460 L 1220 460" />
  </g>

  <!-- center plate: big octagon, crosshatched, with an X cut through it -->
  <g stroke="#111111" stroke-width="14">
    <polygon
      points="620,160 980,160 1080,260 1080,560 980,700 800,760 620,700 520,560 520,260"
      fill="url(#hatch)"
    />
  </g>

  <!-- corner bolts on the center plate -->
  <g fill="#111111" stroke="#f4f2ea" stroke-width="3">
    <circle cx="640" cy="200" r="10" /><circle cx="960" cy="200" r="10" />
    <circle cx="545" cy="300" r="10" /><circle cx="1055" cy="300" r="10" />
    <circle cx="545" cy="520" r="10" /><circle cx="1055" cy="520" r="10" />
    <circle cx="660" cy="680" r="10" /><circle cx="940" cy="680" r="10" />
  </g>

  <!-- the X: two crossing bold bands cut as clean (unhatched) negative space -->
  <g stroke="#111111" stroke-width="14" stroke-linejoin="round">
    <polygon points="600,210 680,210 1000,610 1000,690 920,690" fill="#f4f2ea" />
    <polygon points="1000,210 920,210 600,610 600,690 680,690" fill="#f4f2ea" />
  </g>

  <!-- football sitting into the top of the X, dripping down -->
  <g transform="translate(800,215)">
    <ellipse cx="0" cy="0" rx="95" ry="58" fill="#f4f2ea" stroke="#111111" stroke-width="10" />
    <path d="M -60 0 L 60 0" stroke="#111111" stroke-width="6" />
    <path d="M -20 -14 L -20 14 M 0 -18 L 0 18 M 20 -14 L 20 14" stroke="#111111" stroke-width="6" />
  </g>
  <!-- drip trails falling from the football into the X -->
  <g stroke="#111111" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 760 268 Q 755 320 765 360" />
    <path d="M 800 274 Q 796 330 806 380" />
    <path d="M 840 268 Q 846 320 836 360" />
  </g>
  <g fill="#111111" opacity="0.85">
    <circle cx="765" cy="368" r="6" />
    <circle cx="806" cy="388" r="7" />
    <circle cx="836" cy="368" r="6" />
  </g>

  <!-- CHAMPION plate under the center octagon -->
  <g stroke="#111111" stroke-width="10">
    <polygon points="700,700 900,700 940,740 900,780 700,780 660,740" fill="url(#hatchSide)" />
  </g>

  <!-- ink drips hanging off the whole belt -->
  <g stroke="#111111" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M 120 620 Q 118 670 126 710" />
    <path d="M 220 622 Q 224 660 216 700" />
    <path d="M 320 618 Q 318 655 326 690" />
    <path d="M 620 700 Q 616 740 624 780" />
    <path d="M 940 700 Q 944 740 936 780" />
    <path d="M 1290 622 Q 1286 660 1294 700" />
    <path d="M 1390 618 Q 1394 655 1386 690" />
    <path d="M 1480 620 Q 1482 670 1474 710" />
  </g>
  <g fill="#111111">
    <circle cx="126" cy="716" r="7" />
    <circle cx="216" cy="706" r="6" />
    <circle cx="326" cy="696" r="6" />
    <circle cx="624" cy="786" r="7" />
    <circle cx="936" cy="786" r="7" />
    <circle cx="1294" cy="706" r="6" />
    <circle cx="1386" cy="696" r="6" />
    <circle cx="1474" cy="716" r="7" />
  </g>
</svg>
